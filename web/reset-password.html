<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Réinitialisation du mot de passe - TAKHOTEL</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 420px;
      margin: 60px auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      padding: 28px;
    }

    h1 {
      font-size: 24px;
      text-align: center;
      margin-bottom: 10px;
      color: #1b3c73;
    }

    p {
      text-align: center;
      color: #666;
      margin-bottom: 24px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #333;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border: 1px solid #d0d7e2;
      border-radius: 10px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #1565c0;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
      line-height: 1.5;
    }

    .success {
      background: #e7f7ed;
      color: #1b7a3f;
      display: block;
    }

    .error {
      background: #fdecec;
      color: #b3261e;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Changer le mot de passe</h1>
    <p>Saisissez votre nouveau mot de passe deux fois.</p>

    <div class="field">
      <label for="password">Nouveau mot de passe</label>
      <input type="password" id="password" placeholder="Minimum 6 caractères" />
    </div>

    <div class="field">
      <label for="confirmPassword">Confirmer le mot de passe</label>
      <input type="password" id="confirmPassword" placeholder="Confirmer le mot de passe" />
    </div>

    <button id="submitBtn">Valider</button>

    <div id="message" class="message"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      verifyPasswordResetCode,
      confirmPasswordReset
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAcAfdMKBGGl1M7oa9B0rkrQEZ8D1khZug",
      authDomain: "takhotel-b0a4a.firebaseapp.com",
      projectId: "takhotel-b0a4a",
      storageBucket: "takhotel-b0a4a.firebasestorage.app",
      messagingSenderId: "886351472574",
      appId: "1:886351472574:web:0f9e9206d32fd85d4a7bef",
      measurementId: "G-59VRY0Z2Q3"
    };

    // URL de retour vers ton application web
    // Si ton app arrive directement sur la page de connexion quand l'utilisateur n'est pas connecté,
    // cette URL est suffisante.
    const LOGIN_URL = "https://takhotel-b0a4a.web.app/";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const params = new URLSearchParams(window.location.search);
    const mode = params.get("mode");
    const oobCode = params.get("oobCode");

    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const submitBtn = document.getElementById("submitBtn");
    const messageBox = document.getElementById("message");

    let redirectTimer = null;

    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.className = `message ${type}`;
    }

    function disableForm() {
      passwordInput.disabled = true;
      confirmPasswordInput.disabled = true;
      submitBtn.disabled = true;
    }

    function enableForm() {
      passwordInput.disabled = false;
      confirmPasswordInput.disabled = false;
      submitBtn.disabled = false;
    }

    function redirectToLogin() {
      // Tentative de fermeture si possible
      try {
        window.close();
      } catch (_) {}

      // Redirection certaine
      window.location.replace(LOGIN_URL);
    }

    function startRedirectCountdown(seconds = 12) {
      let remaining = seconds;

      showMessage(
        `Votre mot de passe a été changé avec succès. Redirection automatique vers l’application dans ${remaining} secondes...`,
        "success"
      );

      redirectTimer = setInterval(() => {
        remaining -= 1;

        if (remaining <= 0) {
          clearInterval(redirectTimer);
          redirectToLogin();
          return;
        }

        showMessage(
          `Votre mot de passe a été changé avec succès. Redirection automatique vers l’application dans ${remaining} secondes...`,
          "success"
        );
      }, 1000);
    }

    async function init() {
      if (!oobCode) {
        showMessage("Lien invalide ou incomplet.", "error");
        submitBtn.disabled = true;
        return;
      }

      if (mode && mode !== "resetPassword") {
        showMessage("Ce lien ne correspond pas à une réinitialisation de mot de passe.", "error");
        submitBtn.disabled = true;
        return;
      }

      try {
        await verifyPasswordResetCode(auth, oobCode);
      } catch (e) {
        console.error("Erreur verifyPasswordResetCode:", e);
        showMessage("Ce lien de réinitialisation est invalide, déjà utilisé ou expiré.", "error");
        submitBtn.disabled = true;
      }
    }

    submitBtn.addEventListener("click", async () => {
      const password = passwordInput.value.trim();
      const confirmPassword = confirmPasswordInput.value.trim();

      if (password.length < 6) {
        showMessage("Le mot de passe doit contenir au moins 6 caractères.", "error");
        return;
      }

      if (password !== confirmPassword) {
        showMessage("Les deux mots de passe ne correspondent pas.", "error");
        return;
      }

      try {
        disableForm();
        await confirmPasswordReset(auth, oobCode, password);
        startRedirectCountdown(12);
      } catch (e) {
        console.error("Erreur confirmPasswordReset:", e);
        showMessage("Impossible de modifier le mot de passe. Le lien est peut-être invalide, déjà utilisé ou expiré.", "error");
        enableForm();
      }
    });

    init();
  </script>
</body>
</html>
